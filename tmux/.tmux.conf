# evangelion theme

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
# keep ghostty's bar cursor
set -as terminal-overrides ",xterm-ghostty:Ss=\\E[%p1%d q:Se=\\E[5 q"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# osc52 clipboard
set -g set-clipboard on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# ctrl held through the second key
bind C-z resize-pane -Z
bind z   resize-pane -Z
bind C-c new-window -c "#{pane_current_path}"
bind C-d detach
bind C-n next-window
bind C-p previous-window

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# windows as tabs
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n C-PageUp   previous-window
bind -n C-PageDown next-window
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

set -g status-style "bg=#EB9318,fg=#000000"
# prefix badge, else session name unless it's main
set -g status-left "#{?client_prefix,#[bg=#C50F1F fg=#F2F2F2 bold] ctrl+b #[default] ,#{?#{==:#S,main},,#[bold] #S #[default] }}"
set -g status-left-length 40
set -g status-right "#[fg=#000000] %H:%M #[bg=#000000 fg=#EB9318 bold] #h "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#C50F1F fg=#F2F2F2 bold] #I:#W "
setw -g window-status-style "fg=#000000"
setw -g window-status-bell-style "bg=#C50F1F fg=#F2F2F2 bold"
setw -g window-status-separator ""
set -g pane-active-border-style "fg=#EB9318"
set -g pane-border-style "fg=#767676"
set -g message-style "bg=#C50F1F,fg=#F2F2F2"
set -g mode-style "bg=#C50F1F,fg=#F2F2F2"
set -g copy-mode-selection-style "bg=#F2F2F2,fg=#000000"

# survive reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux

# keep the highlight after releasing the mouse, q clears it
bind -T copy-mode MouseDragEnd1Pane  send -X copy-selection-no-clear
bind -T copy-mode DoubleClick1Pane   select-pane \; send -X select-word \; send -X copy-selection-no-clear
bind -T copy-mode TripleClick1Pane   select-pane \; send -X select-line \; send -X copy-selection-no-clear
